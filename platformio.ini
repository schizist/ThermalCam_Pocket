[platformio]
; Plain Build/Upload only does the main app; target the others explicitly with -e
default_envs = dollhead

[common]
; pioarduino platform = Arduino-ESP32 core 3.x (needed for ledcAttach). Pinned so every PC builds the same.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
lib_deps =
    adafruit/Adafruit AMG88xx Library
    adafruit/Adafruit Unified Sensor
    bblanchon/ArduinoJson
extra_scripts =
    pre:scripts/load_env.py
    post:scripts/fix_esptool.py
build_src_filter = +<*> -<servo_test.cpp>

; USB upload
[env:dollhead]
platform = ${common.platform}
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}
build_src_filter = ${common.build_src_filter}

; Servo type diagnostic — no WiFi/AMG, just the servo on GPIO13 (or 32)
; Flash with:  pio run -t upload -e servo-test
; Monitor:     pio device monitor -e servo-test
[env:servo-test]
platform = ${common.platform}
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_src_filter = -<*> +<servo_test.cpp>
extra_scripts = post:scripts/fix_esptool.py

; OTA upload — device must be on the same network, then run:
;   pio run -t upload -e dollhead-ota
[env:dollhead-ota]
platform = ${common.platform}
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
extra_scripts =
    ${common.extra_scripts}
    pre:scripts/ota_upload.py
build_src_filter = ${common.build_src_filter}
upload_protocol = espota
upload_port = dollhead.local
; OTA password comes from .env via scripts/ota_upload.py
