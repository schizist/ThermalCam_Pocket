[common]
lib_deps =
    adafruit/Adafruit AMG88xx Library
    adafruit/Adafruit Unified Sensor
    bblanchon/ArduinoJson
    ncmreynolds/ld2410
extra_scripts = pre:scripts/load_env.py
build_src_filter = +<*> -<servo_test.cpp>

; USB upload
[env:dollhead]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}
build_src_filter = ${common.build_src_filter}

; Servo type diagnostic — no WiFi/AMG, just the servo on GPIO13 (or 32)
; Flash with:  pio run -t upload -e servo-test
; Monitor:     pio device monitor -e servo-test
[env:servo-test]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_src_filter = -<*> +<servo_test.cpp>

; OTA upload — device must be on the same network, then run:
;   pio run -t upload -e dollhead-ota
[env:dollhead-ota]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}
build_src_filter = ${common.build_src_filter}
upload_protocol = espota
upload_port = 192.168.0.203
upload_flags = --auth=${sysenv.OTA_PASSWORD}
